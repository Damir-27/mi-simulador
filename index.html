<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simulador Bancario</title>

    <link rel="stylesheet" href="./css/style.css">
    <script defer src="./js/main.js"></script>
</head>

<body>

    <header class="encabezado">
        <div class="contenedor">
            <h1>Simulador Bancario</h1>
            <p>Administrá tus cuentas bancarias de manera sencilla.</p>
        </div>
    </header>

    <main class="contenedor">

        <section class="resumen">
            <div class="resumen-card">
                <span>Cuentas registradas</span>
                <h2 id="totalCuentas">0</h2>
            </div>

            <div class="resumen-card">
                <span>Capital total del banco</span>
                <h2 id="capitalTotal">$0</h2>
            </div>
        </section>

        <section class="panel">
            <h2>Registrar nueva cuenta</h2>

            <form id="formularioCuenta">

                <div class="grupo">
                    <label for="titular">Titular</label>
                    <input type="text" id="titular" placeholder="Nombre del titular" required>
                </div>

                <div class="grupo">
                    <label for="numeroCuenta">Número de cuenta</label>
                    <input type="text" id="numeroCuenta" placeholder="Ej: 004" required>
                </div>

                <div class="grupo">
                    <label for="tipoCuenta">Tipo de cuenta</label>
                    <select id="tipoCuenta" required>
                        <option value="">Seleccionar tipo</option>
                        <option value="Caja de ahorro">Caja de ahorro</option>
                        <option value="Cuenta corriente">Cuenta corriente</option>
                    </select>
                </div>

                <div class="grupo">
                    <label for="saldoInicial">Saldo inicial</label>
                    <input type="number" id="saldoInicial" placeholder="Ej: 10000" min="0" step="0.01" required>
                </div>

                <button type="submit" class="boton boton-principal">
                    Crear cuenta
                </button>

            </form>
        </section>

        <section class="panel">
            <div class="titulo-listado">
                <div>
                    <h2>Cuentas bancarias</h2>
                    <p>Consultá y administrá tus cuentas.</p>
                </div>

                <input type="search" id="buscador" placeholder="Buscar por titular o número...">
            </div>

            <button type="button" id="vaciarCuentas" class="boton boton-vaciar">
                Vaciar todas las cuentas
            </button>

            <p id="mensaje" class="mensaje" aria-live="polite"></p>

            <div id="listaCuentas" class="lista-cuentas">
                <!-- Las cuentas se generan dinámicamente desde JavaScript -->
            </div>
        </section>

    </main>

    <footer>
        <p>Mi Primer Simulador | Proyecto JavaScript</p>
    </footer>

</body>

</html>
